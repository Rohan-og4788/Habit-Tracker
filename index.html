<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily progress</p>
          <h1>Habit Tracker</h1>
        </div>
        <div class="topbar-pill">
          <span class="dot"></span>
          <span id="todayLabel">Today</span>
        </div>
      </header>

      <main class="content">
        <section class="panel summary-panel">
          <div class="summary-card accent">
            <span>Total habits</span>
            <strong id="totalHabits">0</strong>
          </div>
          <div class="summary-card">
            <span>Done today</span>
            <strong id="doneToday">0</strong>
          </div>
          <div class="summary-card">
            <span>Best streak</span>
            <strong id="bestStreak">0</strong>
          </div>
        </section>

        <section class="panel form-panel">
          <h2>Add a new habit</h2>
          <form id="habitForm" class="habit-form">
            <label>
              <span>Habit name</span>
              <input id="habitName" type="text" maxlength="40" placeholder="e.g. Drink water" required />
            </label>
            <label>
              <span>Category</span>
              <select id="habitCategory">
                <option value="Health">Health</option>
                <option value="Focus">Focus</option>
                <option value="Learning">Learning</option>
                <option value="Wellbeing">Wellbeing</option>
                <option value="Personal">Personal</option>
              </select>
            </label>
            <button type="submit">Add habit</button>
          </form>
        </section>

        <section class="panel habits-panel">
          <div class="habits-header">
            <h2>Your habits</h2>
            <div class="filter-group" aria-label="Filter habits">
              <button class="filter-btn active" data-filter="all" type="button">All</button>
              <button class="filter-btn" data-filter="done" type="button">Done</button>
              <button class="filter-btn" data-filter="pending" type="button">Pending</button>
            </div>
          </div>
          <div id="habitList" class="habit-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
